name: Agent C
on:
  repository_dispatch:
    types: [agent-task]
  workflow_dispatch:
    inputs:
      mode:
        description: smoke or task (task requires repository_dispatch)
        required: true
        default: smoke
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-c-${{ github.event.client_payload.task.run_id || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global opencode-ai@1.18.34
      - name: Run agent or smoke
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          ROLE: C
          OPENCODE_CONFIG: ${{ github.workspace }}/opencode.json
          MODEL_STUDIO_API_KEY: ${{ secrets.MODEL_STUDIO_API_KEY }}
          MODEL_STUDIO_BASE_URL: ${{ vars.MODEL_STUDIO_BASE_URL }}
        run: |
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            env -u GH_TOKEN -u GITHUB_TOKEN opencode run --pure --format json --model model-studio/qwen3-coder-flash-2025-07-28 '請先用 read 工具讀取 README.md，再以 JSON 回覆其中的標題與 ok=true。' > smoke.jsonl
            python3 -c 'import json; data=[json.loads(x) for x in open("smoke.jsonl")]; assert any(x.get("type")=="tool_use" and x.get("part",{}).get("state",{}).get("status")=="completed" for x in data); assert any(x.get("type")=="text" for x in data)'
          else
            python3 worker.py
          fi
